[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-audit"
version = "0.1.0"
description = "Check whether your LLM-as-a-judge is measuring anything"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Su Myat Noe" }]
keywords = ["llm-as-a-judge", "evaluation", "nlp", "reliability"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[project.scripts]
judge-audit = "judge_audit.audit:main"

[project.urls]
Homepage = "https://github.com/ImSuMyatNoe/judge-audit"

[tool.setuptools]
packages = ["judge_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
