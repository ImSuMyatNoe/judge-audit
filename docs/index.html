<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM as a Judge Is Probably Lying to You</title>
<meta name="description" content="Su Myat Noe, Beyond the Vibes Session 03, SGInnovate, 28 September 2026. The talk as presented.">
<style>
  :root { --paper:#faf6f2; --ink:#201a19; --muted:#7d7069; --line:#cfc2b6; --rose:#c9455b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink);
               font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:48px 24px 72px; }
  .frame { position:relative; width:100%; max-width:1600px; aspect-ratio:16/9; }
  .frame img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
               opacity:0; transition:opacity .18s ease; }
  .frame img.on { opacity:1; }

  .bar { position:fixed; left:0; right:0; bottom:0; height:56px; display:flex; align-items:center;
         gap:18px; padding:0 24px; flex-wrap:nowrap; overflow:hidden; font-size:12px; letter-spacing:.05em; color:var(--muted);
         background:linear-gradient(to top, var(--paper) 60%, rgba(250,246,242,0)); }
  .bar a { color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; }
  .bar a:hover { color:var(--rose); border-bottom-color:var(--rose); }
  .count { font-variant-numeric: tabular-nums; white-space:nowrap; }
  .bar a { white-space:nowrap; }
  .spacer { flex:1 1 auto; }
  button.nav { appearance:none; background:none; border:1px solid var(--line); color:var(--muted);
               border-radius:999px; width:30px; height:30px; cursor:pointer; font:inherit; line-height:1; }
  button.nav:hover { color:var(--rose); border-color:var(--rose); }
  .hint { position:fixed; top:16px; right:20px; font-size:11px; letter-spacing:.06em; color:var(--muted); }
  @media (max-width: 720px) { .hint { display:none; } .bar { font-size:11px; gap:12px; } }
</style>
</head>
<body>
  <div class="stage"><div class="frame" id="frame"></div></div>
  <p class="hint">arrow keys to move</p>
  <div class="bar">
    <button class="nav" id="prev" aria-label="previous slide">&larr;</button>
    <button class="nav" id="next" aria-label="next slide">&rarr;</button>
    <span class="count"><b id="n">1</b> / 30</span>
    <span class="spacer"></span>
    <a href="judge-audit-talk.pdf">download the PDF</a>
    <a href="interactive.html">interactive version</a>
    <a href="https://github.com/ImSuMyatNoe/judge-audit">repo</a>
  </div>
<script>
(function () {
  var TOTAL = 30, frame = document.getElementById('frame'), imgs = [], i = 0;
  for (var k = 1; k <= TOTAL; k++) {
    var im = document.createElement('img');
    im.src = 'slide-' + (k < 10 ? '0' + k : k) + '.jpg';
    im.alt = 'Slide ' + k;
    im.loading = k <= 2 ? 'eager' : 'lazy';
    frame.appendChild(im); imgs.push(im);
  }
  function show(n) {
    if (n < 0) n = 0; if (n > TOTAL - 1) n = TOTAL - 1;
    imgs[i].classList.remove('on'); i = n; imgs[i].classList.add('on');
    document.getElementById('n').textContent = i + 1;
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
    var nxt = imgs[i + 1]; if (nxt) nxt.loading = 'eager';
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(TOTAL - 1);
  });
  document.getElementById('next').addEventListener('click', function () { show(i + 1); });
  document.getElementById('prev').addEventListener('click', function () { show(i - 1); });
  frame.addEventListener('click', function (e) {
    show(e.clientX < window.innerWidth / 2 ? i - 1 : i + 1);
  });
  var x0 = null;
  frame.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  frame.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  }, { passive: true });
  window.addEventListener('hashchange', function () {
    var n = parseInt((location.hash || '').slice(1), 10);
    if (isFinite(n) && n - 1 !== i) show(n - 1);
  });
  var start = parseInt((location.hash || '').slice(1), 10);
  show(isFinite(start) && start > 0 ? start - 1 : 0);
})();
</script>
</body>
</html>
